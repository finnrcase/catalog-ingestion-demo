[project]
name = "catalog-ingestion-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "cloudinary>=1.40.0",
    "fastapi>=0.115.0",
    "html2text>=2024.2.26",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
